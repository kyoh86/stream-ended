name: Release build

on:
  workflow_dispatch:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

jobs:
  windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish Windows x64
        shell: pwsh
        env:
          YOUTUBE_OAUTH_JSON: ${{ secrets.YOUTUBE_OAUTH_JSON }}
          StreamEndedTwitchClientId: ${{ secrets.TWITCH_CLIENT_ID }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:YOUTUBE_OAUTH_JSON)) {
            throw 'Set the YOUTUBE_OAUTH_JSON repository secret.'
          }
          if ([string]::IsNullOrWhiteSpace($env:StreamEndedTwitchClientId)) {
            throw 'Set the TWITCH_CLIENT_ID repository secret.'
          }
          try {
            $oauth = ConvertFrom-Json -InputObject $env:YOUTUBE_OAUTH_JSON -ErrorAction Stop
          } catch {
            throw 'YOUTUBE_OAUTH_JSON must contain valid JSON.'
          }
          if (-not $oauth.installed.client_id -or -not $oauth.installed.client_secret) {
            throw 'YOUTUBE_OAUTH_JSON must contain a Google Desktop app OAuth client.'
          }
          $env:StreamEndedYouTubeOAuthFile = Join-Path $env:RUNNER_TEMP 'youtube-oauth.json'
          try {
            [System.IO.File]::WriteAllText($env:StreamEndedYouTubeOAuthFile, $env:YOUTUBE_OAUTH_JSON)
            Remove-Item Env:YOUTUBE_OAUTH_JSON
            dotnet publish StreamEnded.csproj -c Release -r win-x64 --self-contained true `
              -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish
            if ($LASTEXITCODE -ne 0) {
              throw "dotnet publish failed (exit code $LASTEXITCODE)."
            }
          } finally {
            Remove-Item -LiteralPath $env:StreamEndedYouTubeOAuthFile -ErrorAction SilentlyContinue
          }

      - name: Build installer
        shell: pwsh
        run: |
          winget install --id JRSoftware.InnoSetup --exact --source winget --silent --accept-package-agreements --accept-source-agreements
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup installation failed." }
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path -LiteralPath $compiler)) {
            $compiler = Join-Path $env:LOCALAPPDATA 'Programs\Inno Setup 6\ISCC.exe'
          }
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.Substring(1) } else { '0.0.0' }
          & $compiler "/DAppVersion=$version" installer/StreamEnded.iss
          if ($LASTEXITCODE -ne 0) { throw "Installer compilation failed." }

      - uses: actions/upload-artifact@v4
        with:
          name: StreamEnded-win-x64
          path: |
            publish/StreamEnded.exe
            publish/StreamEnded-Setup-x64.exe
          if-no-files-found: error

  publish-release:
    if: github.event_name == 'push'
    needs: windows-x64
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: StreamEnded-win-x64

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' > release-assets.txt; then
            for asset in StreamEnded.exe StreamEnded-Setup-x64.exe; do
              if ! grep -Fxq "$asset" release-assets.txt; then
                gh release upload "$GITHUB_REF_NAME" "$asset" --repo "$GITHUB_REPOSITORY"
              fi
            done
          else
            gh release create "$GITHUB_REF_NAME" StreamEnded.exe StreamEnded-Setup-x64.exe --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
          fi
